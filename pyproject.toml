[project]
name = "dnd5e-2024-catalog-api"
version = "2.0.0"
description = "API REST somente leitura com o catálogo do Dungeons & Dragons 5e (regras de 2024) a partir do SRD 5.2.1 (CC-BY 4.0)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.0",
    "sqlalchemy>=2.0.35",
    "httpx>=0.27.2",
    "pyjwt>=2.9.0",
    "pytest>=8.3.0",
]

[project.optional-dependencies]
dev = ["pymupdf>=1.24.0"]
